output_dir: emb_cache
models:
  - all-mpnet-base-v2
ae_patience: 10
tune:
  n_trials: 30
  max_epochs: 100
  batch_size: 4096
  val_fraction: 0.1
  patience: 10
  hidden_sizes: [64, 128, 256, 512]
  bottleneck_sizes: [8, 16, 32, 64]
  lr_min: 1.0e-4
  lr_max: 1.0e-2
huggingface:
  upload: true
  repo_id: "artfultom/ae-ai-text-detector"
  token: null
  readme_template: "configs/model_readme_template.md"