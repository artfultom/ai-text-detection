[project]
name = "ai-text-detection"
version = "0.1.0"
description = "HSE Diploma Project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dvc>=3.64.2",
    "dvc-s3>=3.3.0",
    "huggingface-hub>=1.10.1",
    "hydra-core>=1.3.2",
    "llama-cpp-python>=0.3.16",
    "nltk>=3.9.4",
    "openai>=2.26.0",
    "optuna>=4.8.0",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.4.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.0",
]
